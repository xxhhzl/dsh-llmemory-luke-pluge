[project]
name = "dsh-llmemory-luke-kernel"
version = "0.5.8"
description = "DSH 长期记忆插件的 Python 内核"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "tzdata>=2026.5; platform_system == 'Windows'",
]

[project.optional-dependencies]
vector = [
  "sqlite-vec==0.1.9",
]
ann = [
  "sqlite-vec==0.1.9",
  "numpy==2.5.4",
  "usearch==2.26.6",
]

